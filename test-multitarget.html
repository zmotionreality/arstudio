<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Multi-target AR test (throwaway)</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2f3a;
    --text: #e8eaed;
    --text-secondary: #9aa1ac;
    --accent: #4f8cff;
    --danger: #ff5a5a;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 18px 60px; }
  h1 { font-size: 19px; margin: 0 0 6px; }
  p.hint { color: var(--text-secondary); font-size: 13.5px; line-height: 1.5; margin: 0 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  input[type="file"] {
    width: 100%;
    color: var(--text);
    font-size: 13px;
  }
  .thumbs {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .thumb {
    width: 84px;
    text-align: center;
  }
  .thumb img {
    width: 84px;
    height: 84px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: block;
  }
  .thumb p {
    font-size: 11px;
    color: var(--text-secondary);
    margin: 4px 0 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  button {
    font: inherit;
    font-weight: 600;
    font-size: 14px;
    border: none;
    border-radius: var(--radius);
    padding: 11px 16px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    width: 100%;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #status {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 12px;
    min-height: 18px;
  }
  #errorBox {
    font-size: 13px;
    color: var(--danger);
    margin-top: 12px;
    display: none;
    white-space: pre-wrap;
  }

  /* Fullscreen AR test view */
  #arScreen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #000;
  }
  #arContainer { position: absolute; inset: 0; }
  #arContainer video, #arContainer canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #stopBtn {
    position: absolute;
    top: 14px;
    right: 14px;
    width: auto;
