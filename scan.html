<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AR viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:#000; color:#fff; font-family:-apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }

  .screen { position:fixed; inset:0; display:flex; flex-direction:column; }
  .center { align-items:center; justify-content:center; text-align:center; padding:24px; }

  /* Picker screen (shown only if a QR group has more than one item) */
  #pickerScreen { display:none; background:#0c0c10; overflow-y:auto; padding:24px 16px; }
  #pickerScreen h1 { font-size:18px; font-weight:600; margin:8px 0 16px; }
  .picker-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:10px; }
  .picker-item { background:#18181e; border-radius:12px; overflow:hidden; cursor:pointer; border:1px solid #2a2a32; }
  .picker-item img { width:100%; height:110px; object-fit:cover; display:block; }
  .picker-item p { font-size:13px; margin:0; padding:8px 10px; }

  /* Camera / AR screen */
  #arContainer { position:fixed; inset:0; }
  #arContainer video { object-fit:cover; }

  /* Sits near the top, not the bottom — the bottom is where the optional
     Instagram/WhatsApp/etc. link buttons live, and with both anchored to the
     bottom edge the buttons were overlapping and covering this text. */
  #hintOverlay {
    position:fixed; left:0; right:0; top:70px; text-align:center; pointer-events:none;
    font-size:14px; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.6);
  }

  /* Simple static corner-bracket frame shown over the camera while scanning
     — purely visual, no library behavior behind it. */
  #scanFrame {
    display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    width:240px; height:240px; pointer-events:none;
  }
  #scanFrame i { position:absolute; width:28px; height:28px; border:3px solid #fff; opacity:0.85; }
  #scanFrame i:nth-child(1) { top:0; left:0; border-right:none; border-bottom:none; }
  #scanFrame i:nth-child(2) { top:0; right:0; border-left:none; border-bottom:none; }
  #scanFrame i:nth-child(3) { bottom:0; left:0; border-right:none; border-top:none; }
  #scanFrame i:nth-child(4) { bottom:0; right:0; border-left:none; border-top:none; }

  /* Fullscreen playback after "continue without aiming" */
  #playerScreen { display:none; background:#000; }
  #playerVideo { width:100%; height:100%; object-fit:contain; }

  .link-row {
    position:fixed; left:0; right:0; bottom:0; padding:16px; display:flex; gap:8px;
    flex-wrap:wrap; justify-content:center; z-index:5;
  }
  .link-pill {
    background:rgba(255,255,255,0.12); backdrop-filter:blur(6px); color:#fff; padding:8px 14px;
    border-radius:999px; font-size:13px; text-decoration:none; border:1px solid rgba(255,255,255,0.2);
  }

  .status-text { font-size:15px; opacity:0.8; }
  .error-text { font-size:14px; color:#ff8a80; }
  .spinner {
    width:28px; height:28px; border:2px solid rgba(255,255,255,0.25); border-top-color:#fff;
    border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 14px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Close button shown over the camera/AR view and the fullscreen player —
     without it there was no way back except force-closing the browser. */
  #closeArBtn {
    display:none; position:fixed; top:16px; left:16px; z-index:20;
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(0,0,0,0.5); color:#fff; font-size:18px; line-height:1;
    align-items:center; justify-content:center;
  }

  /* Rotate-phone hint: shown briefly when the video's own orientation
     (portrait/landscape) doesn't match how the phone is currently held. */
  #rotateHint {
    display:none; position:fixed; top:16px; left:50%; transform:translateX(-50%);
    z-index:20; background:rgba(0,0,0,0.65); color:#fff; padding:8px 14px;
    border-radius:999px; font-size:13px; align-items:center; gap:8px;
    pointer-events:none; white-space:nowrap;
  }
  #rotateHint svg { animation: rotateWiggle 1.4s ease-in-out infinite; }
  @keyframes rotateWiggle {
    0%, 100% { transform:rotate(0deg); }
    50% { transform:rotate(90deg); }
  }
</style>
</head>
<body>

<div class="screen center" id="loadingScreen">
  <div class="spinner"></div>
  <p class="status-text">Loading…</p>
</div>

<div class="screen center" id="errorScreen" style="display:none;">
  <p class="error-text" id="errorText">This code isn't set up yet.</p>
</div>

<div class="screen" id="pickerScreen">
  <h1>Point your camera at…</h1>
  <div class="picker-grid" id="pickerGrid"></div>
</div>

<div id="arContainer" style="display:none;"></div>
<p id="hintOverlay" style="display:none;">Point your camera at the photo</p>
<div id="scanFrame"><i></i><i></i><i></i><i></i></div>

<button id="closeArBtn" aria-label="Close">✕</button>
<div id="rotateHint">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="6" y="2" width="12" height="20" rx="2" />
  </svg>
  Rotate your phone for fullscreen
</div>

<div class="screen" id="playerScreen">
  <video id="playerVideo" playsinline autoplay></video>
</div>

<div class="link-row" id="linkRow"></div>

<script src="js/supabase-client.js"></script>

<!-- MindAR (image tracking) and three.js ship as ES modules, so they need
     type="module" plus an import map for the bare "three" imports used
     inside mindar-image-three. If the AR camera view fails to start after
     deploying, check https://hiukim.github.io/mind-ar-js-doc/installation/
     for the current recommended versions/URLs — 3rd-party library APIs
     occasionally change between versions. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

<script type="module">
import * as THREE from "three";

const params = new URLSearchParams(window.location.search);
const groupSlug = params.get("g");
const itemSlug = params.get("i");
const demoId = params.get("demo");

const loadingScreen = document.getElementById("loadingScreen");
const errorScreen = document.getElementById("errorScreen");
const pickerScreen = document.getElementById("pickerScreen");
const arContainer = document.getElementById("arContainer");
const hintOverlay = document.getElementById("hintOverlay");
const scanFrame = document.getElementById("scanFrame");
const playerScreen = document.getElementById("playerScreen");
const playerVideo = document.getElementById("playerVideo");
const linkRow = document.getElementById("linkRow");
const closeArBtn = document.getElementById("closeArBtn");
const rotateHint = document.getElementById("rotateHint");

function showOnly(el) {
  [loadingScreen, errorScreen, pickerScreen, arContainer, playerScreen].forEach(s => s.style.display = "none");
  el.style.display = el === arContainer ? "block" : "flex";

  // The close (✕) button only makes sense once the camera or the fullscreen
  // player is actually showing — on every other screen there's nothing to
  // back out of.
  const showClose = el === arContainer || el === playerScreen;
  closeArBtn.style.display = showClose ? "flex" : "none";
  scanFrame.style.display = el === arContainer ? "block" : "none";

  if (el !== playerScreen) {
    clearTimeout(rotateHintTimeout);
    rotateHint.style.display = "none";
  }
}

// Shows a brief "rotate your phone" hint when the video's own orientation
// (landscape/portrait) doesn't match how the phone is currently held —
// otherwise a landscape video plays tiny and letterboxed with no explanation.
let rotateHintTimeout = null;
function updateRotateHint() {
  if (playerScreen.style.display === "none") return;
  const vw = playerVideo.videoWidth, vh = playerVideo.videoHeight;
  if (!vw || !vh) { rotateHint.style.display = "none"; return; }

  const videoIsLandscape = vw > vh;
  const phoneIsPortrait = window.matchMedia("(orientation: portrait)").matches;
  const mismatch = videoIsLandscape === phoneIsPortrait; // landscape video on a portrait phone, or the reverse

  clearTimeout(rotateHintTimeout);
  if (mismatch) {
    rotateHint.style.display = "flex";
    rotateHintTimeout = setTimeout(() => { rotateHint.style.display = "none"; }, 4000);
  } else {
    rotateHint.style.display = "none";
  }
}
playerVideo.addEventListener("loadedmetadata", updateRotateHint);
window.addEventListener("resize", updateRotateHint);
window.addEventListener("orientationchange", updateRotateHint);

// Lets people back out of the camera view or the fullscreen player instead
// of being stuck until they force-close the browser. Goes back to the
// picker (if this code has more than one item and isn't in combined-AR
// mode), restarts the combined AR session (if it is), or restarts the
// camera for the single item.
closeArBtn.addEventListener("click", async () => {
  try { playerVideo.pause(); } catch (e) {}
  linkRow.style.display = "none";
  hintOverlay.style.display = "none";
  // Give instant visual feedback the tap registered — otherwise, while the
  // camera is being released and restarted underneath, the screen doesn't
  // change for a moment and the button can feel unresponsive/stuck.
  showOnly(loadingScreen);
  document.querySelector("#loadingScreen .status-text").textContent = "Restarting camera…";
  await stopMindAR();

  if (combinedMode) {
    startAR(currentArItems);
  } else if (items.length > 1) {
    showPicker();
  } else if (items.length === 1) {
    openItem(items[0]);
  }
});

function showError(msg) {
  document.getElementById("errorText").textContent = msg;
  showOnly(errorScreen);
}

function renderButtons(buttons) {
  linkRow.innerHTML = (buttons || []).map(b =>
    `<a class="link-pill" href="${b.url}" target="_blank" rel="noopener">${b.label}</a>`
  ).join("");
}

// Best-effort, approximate location for basic analytics (city/country only,
// no GPS permission needed). Silently skipped if the lookup fails.
async function logScan(groupId, itemId) {
  let city = null, country = null;
  try {
    const res = await fetch("https://ipapi.co/json/");
    const geo = await res.json();
    city = geo.city || null;
    country = geo.country_name || null;
  } catch (e) { /* analytics only — never block the experience on this */ }
  supabaseClient.from("scans").insert({ qr_group_id: groupId, item_id: itemId, city, country }).then(() => {});
}

let group = null;
let items = [];
let isDemo = false;

async function init() {
  if (demoId) return initByDemo(demoId);
  if (itemSlug) return initByItem();
  if (!groupSlug) return showError("Missing code.");

  const { data: g, error: gErr } = await supabaseClient.from("qr_groups").select("*").eq("slug", groupSlug).single();
  if (gErr || !g) return showError("This code isn't set up yet.");
  group = g;

  const { data: its, error: iErr } = await supabaseClient
    .from("items").select("*").eq("qr_group_id", g.id).eq("active", true).order("sort_order");
  if (iErr || !its || !its.length) return showError("Nothing is live on this code yet.");
  items = its;

  renderButtons(group.buttons);

  const arItems = items.filter(it => it.item_type === "ar");

  if (items.length === 1) {
    openItem(items[0]);
  } else if (arItems.length === items.length && arItems.length > 1) {
    // Every active item behind this code is an AR photo — recognize any of
    // them off one shared camera session instead of making people pick
    // first. A group that mixes AR photos with video-only items keeps the
    // picker below, since video-only items don't have anything for the
    // camera to look for.
    combinedMode = true;
    startAR(arItems);
  } else {
    showPicker();
  }
}

// A code printed for one specific item (mainly text-menu dishes): jumps
// straight to that item's video, skipping the group and any picker.
async function initByItem() {
  const { data: it, error: iErr } = await supabaseClient
    .from("items").select("*").eq("slug", itemSlug).eq("active", true).single();
  if (iErr || !it) return showError("This code isn't set up yet.");

  const { data: g, error: gErr } = await supabaseClient
    .from("qr_groups").select("*").eq("id", it.qr_group_id).single();
  if (gErr || !g) return showError("This code isn't set up yet.");

  group = g;
  items = [it];
  renderButtons(group.buttons);
  openItem(it);
}

// "Try It Yourself" demo: a photo+video pair a visitor uploaded themselves
// on the landing page, stored in its own demo_items table (not qr_groups /
// items — never mixed with real client data), and only playable for about
// an hour after it was created.
async function initByDemo(id) {
  const { data: d, error } = await supabaseClient.from("demo_items").select("*").eq("id", id).single();
  if (error || !d) return showError("This demo wasn't found - it may have already expired.");
  if (new Date(d.expires_at) < new Date()) return showError("This demo has expired. Make a new one from the site.");

  isDemo = true;
  group = { mind_url: d.mind_url, buttons: [] };
  const item = { id: d.id, photo_url: d.photo_url, video_url: d.video_url, item_type: "ar", target_index: 0 };
  items = [item];
  renderButtons([]);
  openItem(item);
}

function showPicker() {
  document.getElementById("pickerGrid").innerHTML = items.map(it => `
    <div class="picker-item" data-id="${it.id}">
      <img src="${it.photo_url}" alt="${it.name}" />
      <p>${it.name}</p>
    </div>`).join("");
  document.querySelectorAll(".picker-item").forEach(el => {
    el.addEventListener("click", () => {
      const item = items.find(i => i.id === el.dataset.id);
      openItem(item);
    });
  });
  showOnly(pickerScreen);
}

// Dispatches to the right experience depending on how this item was set up
// in the admin panel: "video" items have no AR target at all and should
// never touch the camera — they go straight to fullscreen playback.
function openItem(item) {
  if (item.item_type === "video") {
    playDirect(item);
  } else {
    startAR([item]);
  }
}

// Plain video item: no camera, no AR — just play the video fullscreen right away.
function playDirect(item) {
  if (!isDemo) logScan(group.id, item.id);
  playerVideo.src = item.video_url;
  playerVideo.currentTime = 0;
  showOnly(playerScreen);
  linkRow.style.display = "flex";
  playerVideo.play().catch(() => {});
}

let mindarThree = null;
let combinedMode = false; // true once a no-picker, multi-photo AR session has started
let currentArItems = []; // the AR item(s) behind the running/last-started session, for the ✕ button to restart

function mindArReady() {
  return !!(window.MINDAR && window.MINDAR.IMAGE && window.MINDAR.IMAGE.MindARThree);
}

// Fully stops the current camera session before anything starts a new one.
// iOS Safari can get confused — sometimes even bouncing out to its own
// native camera screen instead of showing the page — if a new camera
// session starts before the previous one has actually finished releasing
// the camera. Stopping the render loop first, awaiting stop(), and adding a
// short pause afterwards is the same sequence already validated in testing.
async function stopMindAR() {
  if (!mindarThree) return;
  const mt = mindarThree;
  mindarThree = null;
  try {
    mt.renderer.setAnimationLoop(null);
    await mt.stop();
  } catch (e) { console.error(e); }
  // Give iOS a moment to actually release the camera hardware before
  // anything requests it again — stopping the tracks returns instantly, but
  // the phone can still be mid-teardown for a bit longer than that.
  await new Promise(r => setTimeout(r, 700));
}

// Runs ONE camera session recognizing every item in arItemsList against the
// group's single shared AR file (qr_groups.mind_url) — this is what lets a
// photo-menu's QR code tell several dishes apart with no picker screen.
// A lone AR item (from the picker, or a code with only one item) is just the
// length-1 case of the same thing: one anchor, on the same shared file, at
// that item's own target_index.
async function startAR(arItemsList) {
  currentArItems = arItemsList;
  await stopMindAR(); // make sure any previous camera session is fully gone first

  if (!group.mind_url) {
    showError("AR recognition isn't set up for this yet. Ask the business to rebuild it in the admin panel.");
    return;
  }
  const validItems = arItemsList.filter(it => typeof it.target_index === "number");
  if (!validItems.length) {
    showError("AR recognition isn't set up for this yet. Ask the business to rebuild it in the admin panel.");
    return;
  }

  showOnly(loadingScreen);
  document.querySelector("#loadingScreen .status-text").textContent = "Starting camera…";

  // The MindAR library loads as an ES module, which can finish executing a
  // beat after this script runs — wait briefly instead of failing outright.
  if (!mindArReady()) {
    const start = Date.now();
    while (!mindArReady() && Date.now() - start < 8000) {
      await new Promise(r => setTimeout(r, 200));
    }
  }
  if (!mindArReady()) {
    showError("Couldn't load the camera. Check your connection and reload.");
    return;
  }

  arContainer.innerHTML = "";
  try {
    mindarThree = new window.MINDAR.IMAGE.MindARThree({
      container: arContainer,
      imageTargetSrc: group.mind_url,
      maxTrack: validItems.length,
      // MindAR has its own built-in scanning overlay (corner brackets + a
      // moving line) that it injects directly into <body>, completely
      // separate from our own screens — and it never cleans those elements
      // up when a session stops. Every restart was leaving another one
      // behind, sometimes frozen visible on top of the video. We already
      // have our own loading screen and "point your camera" hint, so turn
      // MindAR's own copies off entirely instead of fighting its cleanup.
      uiLoading: "no",
      uiScanning: "no",
      uiError: "no",
    });
    const { renderer, scene, camera } = mindarThree;

    let switched = false;
    async function switchToFullscreenPlayer(camVideo) {
      switched = true;
      playerVideo.src = camVideo.src;
      playerVideo.currentTime = camVideo.currentTime;
      await stopMindAR();
      showOnly(playerScreen);
      linkRow.style.display = "flex";
      playerVideo.play().catch(() => {});
    }

    validItems.forEach(item => {
      const anchor = mindarThree.addAnchor(item.target_index);

      const video = document.createElement("video");
      video.src = item.video_url;
      video.playsInline = true;
      video.muted = false;
      video.crossOrigin = "anonymous";

      const texture = new THREE.VideoTexture(video);
      const geometry = new THREE.PlaneGeometry(1, 1);
      const material = new THREE.MeshBasicMaterial({ map: texture });
      const plane = new THREE.Mesh(geometry, material);
      anchor.group.add(plane);

      let logged = false;
      anchor.onTargetFound = () => {
        hintOverlay.style.display = "none";
        if (!logged) { logged = true; if (!isDemo) logScan(group.id, item.id); }
        video.play().catch(() => {});
        // After a couple of seconds of confirmed playback, drop out of the
        // camera view into a normal fullscreen video — "continue without aiming".
        setTimeout(() => {
          if (!switched && !video.paused) switchToFullscreenPlayer(video);
        }, 2500);
      };
      anchor.onTargetLost = () => {
        if (!switched) hintOverlay.style.display = "block";
      };
    });

    showOnly(arContainer);
    hintOverlay.style.display = "block";
    linkRow.style.display = "flex";

    // If the browser silently blocks the camera from actually starting (seen
    // on some mobile browsers), start() can hang forever with no error —
    // a timeout means people see a message instead of a stuck black screen.
    const timeout = new Promise((_, reject) =>
      setTimeout(() => reject(new Error("timeout")), 12000)
    );
    await Promise.race([mindarThree.start(), timeout]);
    renderer.setAnimationLoop(() => renderer.render(scene, camera));
  } catch (err) {
    console.error(err);
    await stopMindAR();
    showError("Couldn't start the camera. Make sure camera access is allowed, then reload and try again.");
  }
}

init();
</script>
</body>
</html>
