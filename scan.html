<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:#000; color:#fff; font-family:-apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }

  .screen { position:fixed; inset:0; display:flex; flex-direction:column; }
  .center { align-items:center; justify-content:center; text-align:center; padding:24px; }

  /* Picker screen (shown only if a QR group has more than one item) */
  #pickerScreen { display:none; background:#0c0c10; overflow-y:auto; padding:24px 16px; }
  #pickerScreen h1 { font-size:18px; font-weight:600; margin:8px 0 16px; }
  .picker-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:10px; }
  .picker-item { background:#18181e; border-radius:12px; overflow:hidden; cursor:pointer; border:1px solid #2a2a32; }
  .picker-item img { width:100%; height:110px; object-fit:cover; display:block; }
  .picker-item p { font-size:13px; margin:0; padding:8px 10px; }

  /* Camera / AR screen */
  #arContainer { position:fixed; inset:0; }
  #arContainer video { object-fit:cover; }

  #hintOverlay {
    position:fixed; left:0; right:0; top:70px; text-align:center; pointer-events:none;
    font-size:14px; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.6);
  }
